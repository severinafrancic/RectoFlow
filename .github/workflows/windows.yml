name: Windows checks and portable build
on:
  push:
    branches: [main, integration/rectoflow-0.2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.lock.txt
      - name: Tests
        shell: pwsh
        run: |
          $env:EDGE_CAPTURE_TEST_TMP = Join-Path $env:RUNNER_TEMP 'rectoflow-tests'
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/native_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/native_review_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/native_editor_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate_readme_assets.py --check
      - name: Build and check portable Windows executable
        run: python scripts/build_windows.py
      - name: Relocated executable and PDF integrity smoke test
        run: python tests/frozen_smoke.py
      - name: Unpublished owner-test bundle and exact ZIP smoke
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          python scripts/build_windows.py --owner-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/frozen_smoke.py --archive .build-v021/owner-test/RectoFlow-owner-test-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RectoFlow-windows-x64
          path: artifacts/RectoFlow-*-windows-x64.zip
          if-no-files-found: error
